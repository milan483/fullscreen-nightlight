name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install distribution test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-glib-2.0 dbus-daemon dbus-bin systemd nodejs
      - name: Verify
        env:
          PYTHON: /usr/bin/python3
        run: bash tests/verify.sh
